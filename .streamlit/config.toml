[theme]
base = "dark"
# Barn red marks the things a visitor can move: slider thumbs and ticked boxes.
primaryColor = "#D2452F"
# Soil chocolate and its darker shade back the menus and popovers.
backgroundColor = "#39230F"
secondaryBackgroundColor = "#2A190A"
textColor = "#F0EDE2"
linkColor = "#F4C24C"
borderColor = "#8E7557"
font = "'Libre Franklin', 'Franklin Gothic Medium', 'Helvetica Neue', Arial, sans-serif"
headingFont = "Besley, Clarendon, Rockwell, Georgia, serif"
baseRadius = "3px"
showWidgetBorder = true

[client]
toolbarMode = "minimal"
